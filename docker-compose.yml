version: '3.9'

services:
  db:
    container_name: db
    image: postgres:16.1
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: app
    networks:
      - main-network
    ports:
      - 3306:3306

  adminer:
    container_name: adminer
    image: adminer
    restart: always
    networks:
      - main-network
    ports:
      - 8080:8080

volumes:
  db_data:

networks:
  main-network:
    name: routine_builder_network
